name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend tests + coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tys
          POSTGRES_PASSWORD: tys_dev
          POSTGRES_DB: tys_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tys -d tys_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://tys:tys_dev@localhost:5432/tys_dev
      JWT_SECRET: ci-test-secret
      ENV: development_local
      FRONTEND_URL: http://localhost:3000
      PUBLIC_DOMAIN: localhost
      TYS_FEE_PERCENT: 5
      ADMIN_EMAIL: admin@ticketyourself.com
      ADMIN_PASSWORD: Admin123!
      REACT_APP_BACKEND_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Start backend (instrumented for coverage)
        working-directory: backend
        run: |
          coverage run --parallel-mode -m uvicorn server:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/health > /dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 1
          done
          echo "Backend failed to start in time" >&2
          cat server.log
          exit 1

      - name: Run pytest (instrumented for coverage)
        working-directory: backend
        run: coverage run --parallel-mode -m pytest tests/ -v

      - name: Stop backend
        if: always()
        working-directory: backend
        run: |
          kill -TERM "$(cat server.pid)" 2>/dev/null || true
          sleep 2
          cat server.log || true

      - name: Combine coverage & generate report
        working-directory: backend
        run: |
          coverage combine
          coverage report -m
          coverage xml

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend-test:
    name: Frontend tests + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests with coverage
        run: yarn test:coverage

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

  backend-lint:
    name: Backend lint & format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: black --check
        working-directory: backend
        run: black --check .

      - name: isort --check-only
        working-directory: backend
        run: isort --check-only .

      # Single pass: full report always logged (informational — pre-existing
      # style backlog isn't blocking), but fails the build if any of the
      # real-bug codes (syntax errors, undefined names, bad comparisons)
      # show up, without walking the tree twice.
      - name: flake8
        working-directory: backend
        run: |
          flake8 . --exit-zero | tee /tmp/flake8-full.txt
          ! grep -qE ': (E9|F63|F7|F82)' /tmp/flake8-full.txt

  frontend-lint:
    name: Frontend lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: eslint
        run: yarn lint

      - name: tsc --noEmit
        run: yarn typecheck

  mobile-ci:
    name: Mobile lint & typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: mobile/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: eslint
        run: yarn lint

      - name: tsc --noEmit
        run: yarn typecheck

  docker-build:
    name: Docker build validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build ./backend

      - name: Build frontend image (dev target)
        run: docker build --target dev ./frontend

      - name: Build frontend image (prod target)
        run: docker build --target prod ./frontend
