name: Secret scan

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      # Scans the checked-out tree only (not full git history — old,
      # already-cleaned-up commits shouldn't keep failing new PRs).
      # `.gitleaks-baseline.json` holds known/accepted findings (see repo
      # root) so only genuinely new secrets fail the build.
      # No --redact: gitleaks' baseline match compares the (unredacted)
      # secret value against what's stored in .gitleaks-baseline.json, so
      # redacting here makes every known finding look "new" and defeats the
      # baseline entirely. Confirmed empirically — this is undocumented
      # gitleaks behavior, not a documented tradeoff.
      - name: Run gitleaks
        run: |
          gitleaks detect --no-git --source . -v \
            --baseline-path "${{ github.workspace }}/.gitleaks-baseline.json"
