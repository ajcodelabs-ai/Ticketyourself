services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?must be set}
      POSTGRES_DB: ${POSTGRES_DB:-tys_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tys} -d ${POSTGRES_DB:-tys_production}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tys}:${POSTGRES_PASSWORD:?must be set}@postgres:5432/${POSTGRES_DB:-tys_production}
      JWT_SECRET: ${JWT_SECRET:?must be set}
      ENV: ${ENV:-production}
      # Never reset demo organizers/events/orders on boot in production.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?must be set}
      TYS_FEE_PERCENT: ${TYS_FEE_PERCENT:-5}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_API_BASE: ${STRIPE_API_BASE:-https://api.stripe.com}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      NUVEI_SERVER_APP_CODE: ${NUVEI_SERVER_APP_CODE:-}
      NUVEI_SERVER_APP_KEY: ${NUVEI_SERVER_APP_KEY:-}
      NUVEI_CLIENT_APP_CODE: ${NUVEI_CLIENT_APP_CODE:-}
      NUVEI_CLIENT_APP_KEY: ${NUVEI_CLIENT_APP_KEY:-}
      NUVEI_APP_CODE: ${NUVEI_APP_CODE:-}
      NUVEI_APP_KEY: ${NUVEI_APP_KEY:-}
      NUVEI_ENV: ${NUVEI_ENV:-prod}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-}
      DEUNA_API_KEY: ${DEUNA_API_KEY:-}
      DEUNA_API_SECRET: ${DEUNA_API_SECRET:-}
      DEUNA_POINT_OF_SALES: ${DEUNA_POINT_OF_SALES:-}
      DEUNA_PUBLIC_API_KEY: ${DEUNA_PUBLIC_API_KEY:-}
      DEUNA_PRIVATE_API_KEY: ${DEUNA_PRIVATE_API_KEY:-}
      DEUNA_STORE_CODE: ${DEUNA_STORE_CODE:-}
      DEUNA_ENV: ${DEUNA_ENV:-production}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@ticketyourself.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ticketyourself.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?must be set}
    volumes:
      - backend_event_assets:/app/event_assets
      - backend_microsite_assets:/app/microsite_assets
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn server:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_event_assets:
  backend_microsite_assets:
